services:
  - type: web
    name: cybervps-render-control
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node services/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CYBERVPS_HOST
        value: 0.0.0.0
